<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trio · Nov Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f5;--s2:#efefef;--s3:#e0e0e0;--s4:#cccccc;--accent:#0a0a0a;--accent2:#0a0a0a;--tint:#efefef;--grad:linear-gradient(90deg,var(--accent),var(--accent2));--ink:#0a0a0a;--mute:#888}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh}
.header{padding:28px 20px 18px;background:transparent;border-bottom:1px solid var(--s3)}
.eyebrow{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;color:#888;text-transform:uppercase}
h1{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:.02em;line-height:1;margin:6px 0 4px}
.sub{font-family:'Space Mono',monospace;font-size:10px;color:var(--mute);letter-spacing:.06em;line-height:1.6}
.stats{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.stat{border-left:2px solid #e0e0e0;padding-left:10px}
.stat b{display:block;font-family:'Bebas Neue',sans-serif;font-size:26px;font-weight:400;color:#0a0a0a;line-height:1}
.stat span{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:14px 20px 4px}
.lg{display:flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:9px;color:#555;letter-spacing:.06em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%}
.dot-int{background:rgba(0,0,0,.08)}.dot-long{background:#888}.dot-easy{background:#cccccc}
.dot-lift{background:var(--s4)}.dot-pt{background:#444}.dot-rest{background:var(--s3)}.dot-race{background:var(--grad)}
.wrap{overflow-x:auto;padding:8px 12px 40px}
.cal{min-width:760px}
.head,.week-row .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.head{padding:0 0 4px}
.head div{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--mute);text-align:center}
.week-row{margin-bottom:14px}
.wk-top{display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px 6px}
.wk-top .l{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.04em}
.wk-top .v{font-family:'Space Mono',monospace;font-size:10px;color:var(--mute)}
.week-row.deload .wk-top{background:var(--grad);color:#fff;padding:8px 10px;border-radius:6px 6px 0 0}
.week-row.deload .wk-top .v{color:#c9a227}
.week-row.deload .day{background:#fdfaf3}
.day{min-height:96px;background:#fff;border:1px solid var(--s3);border-radius:6px;padding:7px 6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .1s}
.day:active{transform:scale(.97)}
.day.empty{background:transparent;border:1px dashed var(--s3);cursor:default}
.day .dt{font-family:'Space Mono',monospace;font-size:9px;color:var(--mute)}
.day .tag{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.06em;padding:2px 5px;border-radius:3px;align-self:flex-start;text-transform:uppercase;font-weight:700}
.day .lb{font-size:11px;font-weight:700;line-height:1.25}
.day .km{font-family:'Space Mono',monospace;font-size:9px;color:var(--mute);margin-top:auto}
.t-interval{background:var(--s2)}.t-interval .tag{background:rgba(0,0,0,.08);color:#0a0a0a}
.t-easy .tag{background:rgba(0,0,0,.04);color:#888}
.t-long{background:var(--tint)}.t-long .tag{background:rgba(0,0,0,.07);color:#444;border-left:2px solid #888}
.t-lift .tag{background:var(--s3);color:#444}
.t-station{background:var(--tint)}.t-station .tag{background:var(--ink);color:#fff}
.t-rest{background:var(--bg)}.t-rest .tag{background:var(--s3);color:#777}.t-rest .lb{color:#999;font-weight:500}
.t-race{border:2px solid var(--accent);background:var(--tint)}.t-race .tag{background:var(--grad);color:#fff}
.day.open{outline:2px solid var(--accent)}
.detail-panel{display:none;margin-top:6px;background:#fff;border:1px solid var(--s3);border-left:3px solid var(--accent);border-radius:6px;padding:14px 16px}
.detail-panel.show{display:block}
.dp-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.03em}
.dp-meta{display:flex;gap:22px;margin:8px 0 10px;flex-wrap:wrap}
.dp-meta div span{display:block;font-family:'Space Mono',monospace;font-size:8px;color:var(--mute);letter-spacing:.1em}
.dp-meta div b{font-size:13px}
.dp-list{list-style:none;font-size:13px;line-height:1.6;color:#333}
.dp-list li{padding-left:14px;position:relative}
.dp-list li:before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.foot{text-align:center;font-family:'Space Mono',monospace;font-size:9px;color:var(--mute);letter-spacing:.1em;padding:0 20px 36px}
</style>
</head>
<body>
<div class="header">
  <div class="eyebrow">HYROX OPEN SINGLES · WEEKS 9–13 · HALF MARATHON 28 NOV</div>
  <h1>TRIO</h1>
  <div class="sub">SUB-80 TARGET · WK12 = DELOAD / TAPER · WK13 = RACE WEEK</div>
  <div class="stats">
    <div class="stat"><b>28 NOV</b><span>HALF MARATHON</span></div>
    <div class="stat"><b>SUN</b><span>PT DAY</span></div>
    <div class="stat"><b>14 FEB</b><span>HYROX</span></div>
  </div>
</div>
<div class="legend">
  <div class="lg"><span class="dot dot-int"></span>Interval</div>
  <div class="lg"><span class="dot dot-long"></span>Long</div>
  <div class="lg"><span class="dot dot-easy"></span>Easy</div>
  <div class="lg"><span class="dot dot-lift"></span>Weights</div>
  <div class="lg"><span class="dot dot-pt"></span>PT w/ Jay</div>
  <div class="lg"><span class="dot dot-rest"></span>Rest</div>
  <div class="lg"><span class="dot dot-race"></span>Race</div>
</div>
<div class="wrap"><div class="cal">
  <div class="head"><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div><div>SUN</div></div>
  <div id="cal"></div>
</div></div>
<div class="foot">TRIO · HYROX OPEN · 14 FEB 2027</div>
<script>
const WEEKS = [{"label": "WEEK 9 · 31 OCT–1 NOV", "vol": "~16.5 km", "deload": false, "days": [null, null, null, null, null, {"date": "31 Oct", "type": "long", "tag": "LONG", "label": "Long run 100 min", "pace": "5:45–6:15/km", "km": "~16.5 km", "details": ["100 min at long pace (about 16–17 km)", "Practise race-day fuel: same gel/drink you will use on 28 Nov", "Steady, even effort; no surging"]}, {"date": "1 Nov", "type": "station", "tag": "PT w/ JAY", "label": "Run into stations", "pace": "Compromised running", "km": "", "details": ["Run into each station at moderate loads", "Focus on settling the breathing after the station", "Technique first, load second"]}]}, {"label": "WEEK 10 · 2–8 NOV", "vol": "~47 km", "deload": false, "days": [{"date": "2 Nov", "type": "easy", "tag": "LIFT+EASY", "label": "Leg + easy 8k", "pace": "6:00–6:30/km", "km": "8 km", "details": ["Leg session with your weight PT", "Then easy 8 km at 6:00–6:30/km"]}, {"date": "3 Nov", "type": "lift", "tag": "LIFT", "label": "Upper", "pace": "", "km": "", "details": ["Upper session with your weight PT"]}, {"date": "4 Nov", "type": "interval", "tag": "INTERVAL", "label": "5 × 1 km", "pace": "4:35–4:45/km", "km": "~9 km", "details": ["2 km warm-up + 2 km cool-down", "5 × 1 km at 4:35–4:45/km", "2 min rest between reps", "Hold pace; do not chase faster"]}, {"date": "5 Nov", "type": "easy", "tag": "EASY", "label": "Easy 12 km", "pace": "6:00–6:30/km", "km": "12 km", "details": ["Conversational pace", "Keep it genuinely easy"]}, {"date": "6 Nov", "type": "rest", "tag": "REST", "label": "Rest", "pace": "", "km": "", "details": ["Full rest day", "Sleep, food, walk if you like. No training."]}, {"date": "7 Nov", "type": "long", "tag": "LONG", "label": "Long run 105 min", "pace": "5:45–6:15/km", "km": "~17.5 km", "details": ["105 min at 5:45–6:15/km (about 17–18 km)", "Fuel as practised"]}, {"date": "8 Nov", "type": "station", "tag": "PT w/ JAY", "label": "Race-load stations", "pace": "", "km": "", "details": ["Stations at race loads", "Run between stations at moderate effort"]}]}, {"label": "WEEK 11 · 9–15 NOV", "vol": "~48 km", "deload": false, "days": [{"date": "9 Nov", "type": "easy", "tag": "LIFT+EASY", "label": "Leg + easy 8k", "pace": "6:00–6:30/km", "km": "8 km", "details": ["Leg session with your weight PT", "Then easy 8 km at 6:00–6:30/km"]}, {"date": "10 Nov", "type": "lift", "tag": "LIFT", "label": "Upper", "pace": "", "km": "", "details": ["Upper session with your weight PT"]}, {"date": "11 Nov", "type": "interval", "tag": "INTERVAL", "label": "6 × 1 km", "pace": "4:35–4:45/km", "km": "~10 km", "details": ["2 km warm-up + 2 km cool-down", "6 × 1 km at 4:35–4:45/km", "2 min rest between reps", "Same pace as last week; progress by reps"]}, {"date": "12 Nov", "type": "easy", "tag": "EASY", "label": "Easy 12 km", "pace": "6:00–6:30/km", "km": "12 km", "details": ["Conversational pace", "Keep it genuinely easy"]}, {"date": "13 Nov", "type": "rest", "tag": "REST", "label": "Rest", "pace": "", "km": "", "details": ["Full rest day", "Sleep, food, walk if you like. No training."]}, {"date": "14 Nov", "type": "long", "tag": "LONG", "label": "Long run 110 min (peak)", "pace": "5:45–6:15/km", "km": "~18 km", "details": ["Peak long run of the block", "110 min at 5:45–6:15/km (about 18 km)", "Fuel as practised"]}, {"date": "15 Nov", "type": "station", "tag": "PT w/ JAY", "label": "Race-load stations", "pace": "", "km": "", "details": ["Stations at race loads", "Day after the peak long run: keep running between stations moderate", "Cut a round if legs are heavy"]}]}, {"label": "WEEK 12 · 16–22 NOV · DELOAD / TAPER", "vol": "~29 km", "deload": true, "days": [{"date": "16 Nov", "type": "easy", "tag": "LIFT+EASY", "label": "Leg + easy 6k", "pace": "6:00–6:30/km", "km": "6 km", "details": ["Ask your weight PT to cut leg volume this week", "Then easy 6 km"]}, {"date": "17 Nov", "type": "lift", "tag": "LIFT", "label": "Upper", "pace": "", "km": "", "details": ["Upper session, normal"]}, {"date": "18 Nov", "type": "interval", "tag": "INTERVAL", "label": "3 × 1 km", "pace": "4:35–4:45/km", "km": "~6 km", "details": ["1.5 km warm-up + 1.5 km cool-down", "3 × 1 km at 4:35–4:45/km", "2 min rest between reps"]}, {"date": "19 Nov", "type": "easy", "tag": "EASY", "label": "Easy 7 km", "pace": "6:00–6:30/km", "km": "7 km", "details": ["Conversational pace", "Keep it genuinely easy"]}, {"date": "20 Nov", "type": "rest", "tag": "REST", "label": "Rest", "pace": "", "km": "", "details": ["Full rest day", "Sleep, food, walk if you like. No training."]}, {"date": "21 Nov", "type": "easy", "tag": "EASY", "label": "Easy 10 km", "pace": "6:00–6:30/km", "km": "10 km", "details": ["No long run this week", "Easy and relaxed"]}, {"date": "22 Nov", "type": "station", "tag": "PT w/ JAY", "label": "Light technique", "pace": "", "km": "", "details": ["Light technique work only", "No new loads"]}]}, {"label": "WEEK 13 · 23–29 NOV · RACE WEEK", "vol": "~39 km incl. race", "deload": true, "days": [{"date": "23 Nov", "type": "easy", "tag": "LIFT+EASY", "label": "Light wts + easy 5k", "pace": "6:00–6:30/km", "km": "5 km", "details": ["Light weights only; no heavy legs", "Then easy 5 km"]}, {"date": "24 Nov", "type": "lift", "tag": "LIFT", "label": "Upper", "pace": "", "km": "", "details": ["Upper, lighter than usual"]}, {"date": "25 Nov", "type": "easy", "tag": "EASY", "label": "Easy 8k + 4 strides", "pace": "6:00–6:30/km", "km": "8 km", "details": ["Easy 8 km", "Finish with 4 × 20 sec relaxed strides"]}, {"date": "26 Nov", "type": "easy", "tag": "EASY", "label": "Easy 5 km", "pace": "6:00–6:30/km", "km": "5 km", "details": ["Conversational pace", "Keep it genuinely easy"]}, {"date": "27 Nov", "type": "rest", "tag": "REST", "label": "Rest", "pace": "", "km": "", "details": ["Full rest. Lay out kit, plan breakfast.", "Sleep, food, walk if you like. No training."]}, {"date": "28 Nov", "type": "race", "tag": "RACE", "label": "HALF MARATHON", "pace": "Goal 1:55–2:00 (5:27–5:41/km)", "km": "21.1 km", "details": ["Not a PB attempt; HYROX is the focus", "Start a touch slower than goal pace for the first 5 km", "Fuel as practised"]}, {"date": "29 Nov", "type": "rest", "tag": "REST", "label": "Off / light technique", "pace": "", "km": "", "details": ["Off, or light technique only", "First full HYROX simulation: Sun 6 Dec"]}]}];
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(){
  const root=document.getElementById('cal');
  root.innerHTML='';
  WEEKS.forEach(function(w){
    const row=document.createElement('div');
    row.className='week-row'+(w.deload?' deload':'');
    row.innerHTML='<div class="wk-top"><span class="l">'+esc(w.label)+'</span><span class="v">'+esc(w.vol)+'</span></div>';
    const days=document.createElement('div');days.className='days';
    const panel=document.createElement('div');panel.className='detail-panel';
    let openEl=null;
    w.days.forEach(function(d){
      const el=document.createElement('div');
      if(d===null){el.className='day empty';days.appendChild(el);return;}
      el.className='day t-'+d.type;
      el.innerHTML='<div class="dt">'+esc(d.date)+'</div><div class="tag">'+esc(d.tag)+'</div><div class="lb">'+esc(d.label)+'</div><div class="km">'+esc(d.km)+'</div>';
      el.addEventListener('click',function(){
        if(openEl===el){panel.classList.remove('show');el.classList.remove('open');openEl=null;return;}
        if(openEl)openEl.classList.remove('open');
        openEl=el;el.classList.add('open');
        panel.innerHTML='<div class="dp-title">'+esc(d.date)+' · '+esc(d.label)+'</div>'+
          '<div class="dp-meta"><div><span>PACE</span><b>'+esc(d.pace||'—')+'</b></div><div><span>VOLUME</span><b>'+esc(d.km||'—')+'</b></div><div><span>TYPE</span><b>'+esc(d.tag)+'</b></div></div>'+
          '<ul class="dp-list">'+(d.details||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
        panel.classList.add('show');
      });
      days.appendChild(el);
    });
    row.appendChild(days);row.appendChild(panel);
    root.appendChild(row);
  });
}
render();
</script>
</body>
</html>
