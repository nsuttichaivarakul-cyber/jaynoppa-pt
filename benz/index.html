<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benz · Nov Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f5;--s2:#efefef;--s3:#e0e0e0;--s4:#cccccc;--accent:#e0218a;--accent2:#e0218a;--tint:#fdeaf3;--grad:linear-gradient(90deg,var(--accent),var(--accent2));--ink:#0a0a0a;--mute:#888}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh}
.header{padding:28px 20px 18px;background:transparent;border-bottom:1px solid var(--s3)}
.eyebrow{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;color:#e0218a;text-transform:uppercase}
h1{font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:.02em;line-height:1;margin:6px 0 4px}
.sub{font-family:'Space Mono',monospace;font-size:10px;color:var(--mute);letter-spacing:.06em;line-height:1.6}
.stats{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.stat{border-left:2px solid #e0218a;padding-left:10px}
.stat b{display:block;font-family:'Bebas Neue',sans-serif;font-size:26px;font-weight:400;color:#e0218a;line-height:1}
.stat span{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:12px;padding:14px 20px 4px}
.lg{display:flex;align-items:center;gap:6px;font-family:'Space Mono',monospace;font-size:9px;color:#555;letter-spacing:.06em;text-transform:uppercase}
.dot{width:8px;height:8px;border-radius:50%}
.dot-int{background:#e0218a}.dot-long{background:#e0218a}.dot-easy{background:#f8b8d8}
.dot-lift{background:var(--s4)}.dot-pt{background:#e0218a}.dot-rest{background:var(--s3)}.dot-race{background:var(--grad)}
.wrap{overflow-x:auto;padding:8px 12px 40px}
.cal{min-width:760px}
.head,.week-row .days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.head{padding:0 0 4px}
.head div{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.1em;color:var(--mute);text-align:center}
.week-row{margin-bottom:14px}
.wk-top{display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px 6px}
.wk-top .l{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.04em}
.wk-top .v{font-family:'Space Mono',monospace;font-size:10px;color:var(--mute)}
.week-row.deload .wk-top{background:var(--grad);color:#fff;padding:8px 10px;border-radius:6px 6px 0 0}
.week-row.deload .wk-top .v{color:#ffffff}
.week-row.deload .day{background:#fdf0f6}
.day{min-height:96px;background:#fff;border:1px solid var(--s3);border-radius:6px;padding:7px 6px;cursor:pointer;display:flex;flex-direction:column;gap:4px;transition:transform .1s}
.day:active{transform:scale(.97)}
.day.empty{background:transparent;border:1px dashed var(--s3);cursor:default}
.day .dt{font-family:'Space Mono',monospace;font-size:9px;color:var(--mute)}
.day .tag{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.06em;padding:2px 5px;border-radius:3px;align-self:flex-start;text-transform:uppercase;font-weight:700}
.day .lb{font-size:11px;font-weight:700;line-height:1.25}
.day .km{font-family:'Space Mono',monospace;font-size:9px;color:var(--mute);margin-top:auto}
.t-interval{background:var(--s2)}.t-interval .tag{background:#e0218a;color:#ffffff}
.t-easy .tag{background:rgba(224,33,138,.08);color:#e0218a}
.t-long{background:var(--tint)}.t-long .tag{background:rgba(224,33,138,.15);color:#a04a72;border-left:2px solid #e0218a}
.t-lift .tag{background:var(--s3);color:#444}
.t-station{background:var(--tint)}.t-station .tag{background:var(--ink);color:#fff}
.t-rest{background:var(--bg)}.t-rest .tag{background:var(--s3);color:#777}.t-rest .lb{color:#999;font-weight:500}
.t-race{border:2px solid var(--accent);background:var(--tint)}.t-race .tag{background:var(--grad);color:#fff}
.day.open{outline:2px solid var(--accent)}
.detail-panel{display:none;margin-top:6px;background:#fff;border:1px solid var(--s3);border-left:3px solid var(--accent);border-radius:6px;padding:14px 16px}
.detail-panel.show{display:block}
.dp-title{font-family:'Bebas Neue',sans-serif;font-size:24px;letter-spacing:.03em}
.dp-meta{display:flex;gap:22px;margin:8px 0 10px;flex-wrap:wrap}
.dp-meta div span{display:block;font-family:'Space Mono',monospace;font-size:8px;color:var(--mute);letter-spacing:.1em}
.dp-meta div b{font-size:13px}
.dp-list{list-style:none;font-size:13px;line-height:1.6;color:#333}
.dp-list li{padding-left:14px;position:relative}
.dp-list li:before{content:"";position:absolute;left:0;top:9px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.foot{text-align:center;font-family:'Space Mono',monospace;font-size:9px;color:var(--mute);letter-spacing:.1em;padding:0 20px 36px}
</style>
</head>
<body>
<div class="header">
  <div class="eyebrow">HYROX DOUBLES · WEEKS 9–13 · HALF MARATHON 28 NOV</div>
  <h1>BENZ</h1>
  <div class="sub">SUB-80 TARGET (TEAM) · WK12 = TAPER · WK13 = RACE WEEK</div>
  <div class="stats">
    <div class="stat"><b>28 NOV</b><span>HALF MARATHON</span></div>
    <div class="stat"><b>SUN</b><span>PT DAY</span></div>
    <div class="stat"><b>14 FEB</b><span>HYROX</span></div>
  </div>
</div>
<div class="legend">
  <div class="lg"><span class="dot dot-int"></span>Interval</div>
  <div class="lg"><span class="dot dot-long"></span>Long</div>
  <div class="lg"><span class="dot dot-easy"></span>Easy</div>
  <div class="lg"><span class="dot dot-lift"></span>Weights</div>
  <div class="lg"><span class="dot dot-pt"></span>PT w/ Jay</div>
  <div class="lg"><span class="dot dot-rest"></span>Rest</div>
  <div class="lg"><span class="dot dot-race"></span>Race</div>
</div>
<div class="wrap"><div class="cal">
  <div class="head"><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div><div>SUN</div></div>
  <div id="cal"></div>
</div></div>
<div class="foot">BENZ · HYROX DOUBLES · 14 FEB 2027</div>
<script>
const WEEKS = [{"label": "WEEK 9 · 31 OCT–1 NOV", "vol": "~11.3 km", "deload": false, "days": [null, null, null, null, null, {"date": "31 Oct", "type": "long", "tag": "LONG", "label": "Long run 85 min", "pace": "7:15–7:45/km", "km": "~11.3 km", "details": ["85 min at long pace, together with Toei", "Practise race-day fuel"]}, {"date": "1 Nov", "type": "station", "tag": "PT w/ JAY", "label": "Stations", "pace": "", "km": "", "details": ["Stations, very little running", "Technique and teamwork"]}]}, {"label": "WEEK 10 · 2–8 NOV", "vol": "~27.0 km", "deload": false, "days": [{"date": "2 Nov", "type": "lift", "tag": "LIFT", "label": "Weights", "pace": "", "km": "", "details": ["Session with your weight PT"]}, {"date": "3 Nov", "type": "lift", "tag": "LIFT", "label": "Weights", "pace": "", "km": "", "details": ["Session with your weight PT"]}, {"date": "4 Nov", "type": "interval", "tag": "INTERVAL", "label": "4 × 800 m", "pace": "5:50–6:05/km", "km": "~7.2 km", "details": ["2 km warm-up + cool-down", "4 × 800 m at 5:50–6:05/km", "3 min rest between reps", "Hold the pace; do not speed up"]}, {"date": "5 Nov", "type": "easy", "tag": "EASY", "label": "Easy 55 min", "pace": "7:30–8:00/km", "km": "~7.1 km", "details": ["Easy and conversational, together with Toei"]}, {"date": "6 Nov", "type": "rest", "tag": "REST", "label": "Rest", "pace": "", "km": "", "details": ["Full rest day", "Sleep, food, walk if you like. No training."]}, {"date": "7 Nov", "type": "long", "tag": "LONG", "label": "Long run 95 min", "pace": "7:15–7:45/km", "km": "~12.7 km", "details": ["95 min at long pace, together", "Fuel as practised"]}, {"date": "8 Nov", "type": "station", "tag": "PT w/ JAY", "label": "Race-load stations", "pace": "", "km": "", "details": ["Race-load stations at your own weights", "Run between stations at easy pace"]}]}, {"label": "WEEK 11 · 9–15 NOV", "vol": "~27.6 km", "deload": false, "days": [{"date": "9 Nov", "type": "lift", "tag": "LIFT", "label": "Weights", "pace": "", "km": "", "details": ["Session with your weight PT"]}, {"date": "10 Nov", "type": "lift", "tag": "LIFT", "label": "Weights", "pace": "", "km": "", "details": ["Session with your weight PT"]}, {"date": "11 Nov", "type": "interval", "tag": "INTERVAL", "label": "4 × 800 m", "pace": "5:50–6:05/km", "km": "~7.2 km", "details": ["2 km warm-up + cool-down", "4 × 800 m at 5:50–6:05/km", "3 min rest between reps", "Hold the pace; do not speed up"]}, {"date": "12 Nov", "type": "easy", "tag": "EASY", "label": "Easy 55 min", "pace": "7:30–8:00/km", "km": "~7.1 km", "details": ["Easy and conversational, together with Toei"]}, {"date": "13 Nov", "type": "rest", "tag": "REST", "label": "Rest", "pace": "", "km": "", "details": ["Full rest day", "Sleep, food, walk if you like. No training."]}, {"date": "14 Nov", "type": "long", "tag": "LONG", "label": "Long run 100 min (peak)", "pace": "7:15–7:45/km", "km": "~13.3 km", "details": ["Peak long run of the block", "100 min at long pace, together", "If anything feels niggly, trim to 85–90 min"]}, {"date": "15 Nov", "type": "station", "tag": "PT w/ JAY", "label": "Light technique", "pace": "", "km": "", "details": ["Light technique, no running", "Recover after the peak long run"]}]}, {"label": "WEEK 12 · 16–22 NOV · TAPER", "vol": "~15.4 km", "deload": true, "days": [{"date": "16 Nov", "type": "lift", "tag": "LIFT", "label": "Weights (less leg)", "pace": "", "km": "", "details": ["Session with your weight PT"]}, {"date": "17 Nov", "type": "lift", "tag": "LIFT", "label": "Weights", "pace": "", "km": "", "details": ["Session with your weight PT"]}, {"date": "18 Nov", "type": "interval", "tag": "INTERVAL", "label": "3 × 800 m", "pace": "5:50–6:05/km", "km": "~4.4 km", "details": ["1 km warm-up + cool-down", "3 × 800 m at 5:50–6:05/km", "3 min rest between reps", "Hold the pace; do not speed up"]}, {"date": "19 Nov", "type": "easy", "tag": "EASY", "label": "Easy 35 min", "pace": "7:30–8:00/km", "km": "~4.5 km", "details": ["Easy and conversational, together with Toei"]}, {"date": "20 Nov", "type": "rest", "tag": "REST", "label": "Rest", "pace": "", "km": "", "details": ["Full rest day", "Sleep, food, walk if you like. No training."]}, {"date": "21 Nov", "type": "long", "tag": "LONG", "label": "Easy 50 min", "pace": "7:15–7:45/km", "km": "~6.5 km", "details": ["50 min easy, no long run this week"]}, {"date": "22 Nov", "type": "station", "tag": "PT w/ JAY", "label": "Technique only", "pace": "", "km": "", "details": ["Technique only, no new loads"]}]}, {"label": "WEEK 13 · 23–29 NOV · RACE WEEK", "vol": "~27 km incl. race", "deload": true, "days": [{"date": "23 Nov", "type": "lift", "tag": "LIFT", "label": "Weights (no heavy legs)", "pace": "", "km": "", "details": ["Keep it light; no heavy legs"]}, {"date": "24 Nov", "type": "lift", "tag": "LIFT", "label": "Weights, light", "pace": "", "km": "", "details": ["Session with your weight PT"]}, {"date": "25 Nov", "type": "easy", "tag": "EASY", "label": "Easy 25 min + 4 strides", "pace": "7:30–8:00/km", "km": "~3.2 km", "details": ["25 min easy", "Finish with 4 × 20 sec relaxed strides"]}, {"date": "26 Nov", "type": "easy", "tag": "EASY", "label": "Easy 20 min / off", "pace": "7:30–8:00/km", "km": "~2.6 km", "details": ["20 min easy, or take the day off"]}, {"date": "27 Nov", "type": "rest", "tag": "REST", "label": "Rest", "pace": "", "km": "", "details": ["Full rest. Lay out kit, plan breakfast.", "Sleep, food, walk if you like. No training."]}, {"date": "28 Nov", "type": "race", "tag": "RACE", "label": "HALF MARATHON", "pace": "Goal 2:30–2:40 (7:07–7:35/km)", "km": "21.1 km", "details": ["Goal time 2:30–2:40", "Start 10–15 sec/km slower than goal for the first 10 km", "Run-walk through aid stations if needed", "Fuel as practised"]}, {"date": "29 Nov", "type": "rest", "tag": "REST", "label": "Off / easy walk", "pace": "", "km": "", "details": ["Off, or an easy walk only"]}]}];
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function render(){
  const root=document.getElementById('cal');
  root.innerHTML='';
  WEEKS.forEach(function(w){
    const row=document.createElement('div');
    row.className='week-row'+(w.deload?' deload':'');
    row.innerHTML='<div class="wk-top"><span class="l">'+esc(w.label)+'</span><span class="v">'+esc(w.vol)+'</span></div>';
    const days=document.createElement('div');days.className='days';
    const panel=document.createElement('div');panel.className='detail-panel';
    let openEl=null;
    w.days.forEach(function(d){
      const el=document.createElement('div');
      if(d===null){el.className='day empty';days.appendChild(el);return;}
      el.className='day t-'+d.type;
      el.innerHTML='<div class="dt">'+esc(d.date)+'</div><div class="tag">'+esc(d.tag)+'</div><div class="lb">'+esc(d.label)+'</div><div class="km">'+esc(d.km)+'</div>';
      el.addEventListener('click',function(){
        if(openEl===el){panel.classList.remove('show');el.classList.remove('open');openEl=null;return;}
        if(openEl)openEl.classList.remove('open');
        openEl=el;el.classList.add('open');
        panel.innerHTML='<div class="dp-title">'+esc(d.date)+' · '+esc(d.label)+'</div>'+
          '<div class="dp-meta"><div><span>PACE</span><b>'+esc(d.pace||'—')+'</b></div><div><span>VOLUME</span><b>'+esc(d.km||'—')+'</b></div><div><span>TYPE</span><b>'+esc(d.tag)+'</b></div></div>'+
          '<ul class="dp-list">'+(d.details||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
        panel.classList.add('show');
      });
      days.appendChild(el);
    });
    row.appendChild(days);row.appendChild(panel);
    root.appendChild(row);
  });
}
render();
</script>
</body>
</html>
