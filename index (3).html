<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Benz</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f5f5;
  --s1:#ffffff;
  --s2:#efefef;
  --s3:#e0e0e0;
  --s4:#cccccc;
  --ink:#0a0a0a;
  --grey1:#444;
  --grey2:#888;
  --grey3:#bbb;
  --accent:#e0218a;
  --accent-tint:#fdeaf3;
}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh;}

header{padding:28px 24px 20px;border-bottom:1px solid var(--s3);}
.h-inner{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px;}
.h-eye{font-family:'Space Mono',monospace;font-size:8px;color:var(--accent);letter-spacing:4px;margin-bottom:8px;font-weight:700;}
.h-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(32px,6vw,56px);letter-spacing:3px;line-height:.9;color:var(--ink);}
.h-sub{font-family:'Space Mono',monospace;font-size:8px;color:var(--grey2);letter-spacing:2px;margin-top:8px;}
.h-right{display:flex;gap:8px;flex-wrap:wrap;}
.h-stat{border:1px solid var(--accent);border-radius:6px;padding:10px 14px;text-align:center;min-width:70px;}
.h-stat-v{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:1px;line-height:1;color:var(--accent);}
.h-stat-l{font-family:'Space Mono',monospace;font-size:6px;color:var(--grey2);letter-spacing:1.5px;margin-top:2px;}

.legend{max-width:1000px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid var(--s3);}
.leg{display:flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--s3);border-radius:3px;}
.leg-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.leg-label{font-family:'Space Mono',monospace;font-size:7px;color:var(--grey2);letter-spacing:1px;}

.main{max-width:1000px;margin:0 auto;padding:20px 24px 60px;}

.dow-row{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px;}
.dow{font-family:'Space Mono',monospace;font-size:7px;color:var(--grey3);text-align:center;padding:4px 0;letter-spacing:1px;}

.week-row{margin-bottom:14px;}
.week-meta{display:flex;justify-content:space-between;align-items:center;padding:2px 4px;margin-bottom:4px;}
.wm-label{font-family:'Space Mono',monospace;font-size:8px;color:var(--grey2);letter-spacing:1.5px;}
.wm-vol{font-family:'Bebas Neue',sans-serif;font-size:14px;color:var(--accent);letter-spacing:1px;}
.wm-vol.deload{color:#9c1861;}

.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}

.day{background:var(--s1);border:1px solid var(--s3);border-radius:4px;min-height:80px;padding:6px 6px;cursor:pointer;transition:background .1s,border-color .1s;}
.day:hover{background:var(--accent-tint);border-color:var(--accent);}
.day.selected{border-color:var(--accent) !important;background:var(--accent-tint);}
.day-num{font-family:'Space Mono',monospace;font-size:7px;color:var(--grey2);margin-bottom:3px;}
.day-tag{display:inline-block;border-radius:2px;padding:1px 4px;margin-bottom:3px;}
.day-tag span{font-family:'Space Mono',monospace;font-size:6px;letter-spacing:.5px;}
.day-label{font-family:'DM Sans',sans-serif;font-weight:600;font-size:9px;color:var(--ink);line-height:1.2;margin-bottom:2px;}
.day-pace{font-family:'Space Mono',monospace;font-size:6.5px;color:var(--grey3);}

.t-interval .day-tag{background:var(--accent);}.t-interval .day-tag span{color:#fff;}
.t-interval{border-left:2px solid var(--accent);}

.t-easy .day-tag{background:rgba(224,33,138,.08);}.t-easy .day-tag span{color:var(--accent);}

.t-long .day-tag{background:rgba(224,33,138,.15);}.t-long .day-tag span{color:#9c1861;}
.t-long{border-left:2px solid var(--accent);}

.t-lift .day-tag{background:rgba(0,0,0,.05);}.t-lift .day-tag span{color:var(--grey1);}
.t-lift{border-left:2px solid var(--grey2);}

.t-station .day-tag{background:var(--ink);}.t-station .day-tag span{color:#fff;}
.t-station{border:1px solid var(--ink) !important;border-left:2px solid var(--accent) !important;}

.t-rest .day-tag{background:rgba(0,0,0,.02);}.t-rest .day-tag span{color:var(--grey3);}
.t-rest .day-label{color:var(--grey3);}

.week-row.deload .day{background:#fdf0f6;}
.week-row.deload .week-meta{background:var(--accent);border-radius:6px;padding:6px 10px;margin-bottom:6px;}
.week-row.deload .wm-label{color:#fff;}
.week-row.deload .wm-vol.deload{color:#fff;}

.detail-panel{background:var(--s1);border:1px solid var(--s4);border-left:2px solid var(--accent);border-radius:6px;padding:18px 20px;margin-top:8px;margin-bottom:8px;display:none;}
.detail-panel.open{display:block;}
.dp-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.dp-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--ink);line-height:1;}
.dp-date{font-family:'Space Mono',monospace;font-size:8px;color:var(--grey2);margin-top:3px;letter-spacing:1px;}
.dp-close{background:var(--s2);border:1px solid var(--s3);border-radius:4px;color:var(--grey1);cursor:pointer;padding:3px 10px;font-family:'Space Mono',monospace;font-size:10px;flex-shrink:0;}
.dp-stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.dp-stat{background:var(--accent-tint);border:1px solid var(--s3);border-radius:5px;padding:8px 12px;}
.dp-stat-l{font-family:'Space Mono',monospace;font-size:7px;color:var(--grey2);letter-spacing:1.5px;margin-bottom:3px;}
.dp-stat-v{font-family:'Bebas Neue',sans-serif;font-size:18px;color:var(--accent);line-height:1;letter-spacing:1px;}
.dp-breakdown{border-top:1px solid var(--s3);padding-top:12px;}
.dp-breakdown-label{font-family:'Space Mono',monospace;font-size:7px;color:var(--grey2);letter-spacing:2px;margin-bottom:8px;}
.dp-items{display:flex;flex-direction:column;gap:5px;}
.dp-item{display:flex;align-items:flex-start;gap:8px;}
.dp-item-dot{width:4px;height:4px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:5px;}
.dp-item-text{font-family:'DM Sans',sans-serif;font-size:12px;color:var(--grey1);line-height:1.4;}

footer{border-top:1px solid var(--s3);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;max-width:1000px;margin:0 auto;}
.f-brand{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:4px;color:var(--accent);}
.f-meta{font-family:'Space Mono',monospace;font-size:7px;color:var(--grey3);letter-spacing:2px;}

@media(max-width:700px){
  .main{padding:14px 12px 40px;}
  header{padding:20px 12px 16px;}
  .h-right{display:none;}
  .dow{font-size:6px;}
  .day{min-height:66px;}
}
</style>
</head>
<body>

<header>
  <div class="h-inner">
    <div>
      <div class="h-eye">HYROX DOUBLES · PHASE 1 · FOUNDATION</div>
      <div class="h-title">BENZ</div>
      <div class="h-sub">SUB-80 TARGET (TEAM) · WEEKS 1–4 · WK4 = DELOAD</div>
    </div>
    <div class="h-right">
      <div class="h-stat"><div class="h-stat-v">01</div><div class="h-stat-l">PHASE</div></div>
      <div class="h-stat"><div class="h-stat-v">SUN</div><div class="h-stat-l">PT DAY</div></div>
      <div class="h-stat"><div class="h-stat-v">14 FEB</div><div class="h-stat-l">RACE DAY</div></div>
    </div>
  </div>
</header>

<div class="legend">
  <div class="leg"><div class="leg-dot" style="background:#e0218a;"></div><span class="leg-label">INTERVAL</span></div>
  <div class="leg"><div class="leg-dot" style="background:#9c1861;"></div><span class="leg-label">LONG RUN</span></div>
  <div class="leg"><div class="leg-dot" style="background:#f7b8d8;"></div><span class="leg-label">EASY</span></div>
  <div class="leg"><div class="leg-dot" style="background:#888;"></div><span class="leg-label">LIFT</span></div>
  <div class="leg"><div class="leg-dot" style="background:#0a0a0a;border:1px solid #e0218a;"></div><span class="leg-label">PT / STATION</span></div>
  <div class="leg"><div class="leg-dot" style="background:#e0e0e0;border:1px solid #bbb;"></div><span class="leg-label">REST</span></div>
  <div class="leg" style="background:rgba(224,33,138,.06);border-color:#e0218a;"><span class="leg-label" style="color:#e0218a;">TAP DAY → DETAILS</span></div>
</div>

<div class="main">
  <div class="dow-row" id="dow-row"></div>
  <div id="weeks-container"></div>
</div>

<footer>
  <div class="f-brand">BENZ · HYROX DOUBLES · 14 FEB 2027</div>
  <div class="f-meta">UPDATED MONTHLY BY JAY</div>
</footer>

<script>
const DOW_LABELS = ["MON","TUE","WED","THU","FRI","SAT","SUN"];

const WEEKS = [
  {
    label: "WEEK 1 · BUILD", vol: "~17.5 km", deload: false,
    days: [
      {date:"31 AUG",type:"lift",tag:"LIFT",label:"Weight",pace:"",km:"",details:["Own weight training program"]},
      {date:"1 SEP",type:"lift",tag:"LIFT",label:"Weight",pace:"",km:"",details:["Own weight training program"]},
      {date:"2 SEP",type:"interval",tag:"INTERVAL",label:"Interval — 400m",pace:"~6:20/km",km:"3.6 km",details:["Warm-up: 1 km easy","Main set: 4 × 400m @ ~6:20/km pace","Rest: standing rest between reps (first interval week)","Cool down: 1 km easy"]},
      {date:"3 SEP",type:"easy",tag:"EASY",label:"Easy Run",pace:"7:30–8:00/km",km:"45 min",details:["Easy 45 min @ 7:30–8:00/km","~5.9 km · Zone 2 · relaxed"]},
      {date:"4 SEP",type:"rest",tag:"REST",label:"Rest",pace:"",km:"",details:["Full rest day"]},
      {date:"5 SEP",type:"long",tag:"LONG",label:"Long Run",pace:"7:15–7:45/km",km:"60 min",details:["Long run 60 min @ 7:15–7:45/km","~8.0 km · steady aerobic effort"]},
      {date:"6 SEP",type:"station",tag:"PT",label:"HYROX w/ Jay",pace:"",km:"",details:["HYROX station technique work — doubles pairing with Toei"]},
    ]
  },
  {
    label: "WEEK 2 · BUILD", vol: "~18.9 km", deload: false,
    days: [
      {date:"7 SEP",type:"lift",tag:"LIFT",label:"Weight",pace:"",km:"",details:["Own weight training program"]},
      {date:"8 SEP",type:"lift",tag:"LIFT",label:"Weight",pace:"",km:"",details:["Own weight training program"]},
      {date:"9 SEP",type:"interval",tag:"INTERVAL",label:"Interval — 400m",pace:"~6:20/km",km:"5.0 km",details:["Warm-up: 1.5 km easy","Main set: 5 × 400m @ ~6:20/km pace","Rest: 90 sec jog between reps","Cool down: 1.5 km easy","One extra rep from last week"]},
      {date:"10 SEP",type:"easy",tag:"EASY",label:"Easy Run",pace:"7:30–8:00/km",km:"45 min",details:["Easy 45 min @ 7:30–8:00/km"]},
      {date:"11 SEP",type:"rest",tag:"REST",label:"Rest",pace:"",km:"",details:["Full rest day"]},
      {date:"12 SEP",type:"long",tag:"LONG",label:"Long Run",pace:"7:15–7:45/km",km:"60 min",details:["Long run 60 min @ 7:15–7:45/km"]},
      {date:"13 SEP",type:"station",tag:"PT",label:"HYROX w/ Jay",pace:"",km:"",details:["HYROX station technique work"]},
    ]
  },
  {
    label: "WEEK 3 · BUILD", vol: "~20.3 km", deload: false,
    days: [
      {date:"14 SEP",type:"lift",tag:"LIFT",label:"Weight",pace:"",km:"",details:["Own weight training program"]},
      {date:"15 SEP",type:"lift",tag:"LIFT",label:"Weight",pace:"",km:"",details:["Own weight training program"]},
      {date:"16 SEP",type:"interval",tag:"INTERVAL",label:"Interval — 400m",pace:"~6:20/km",km:"6.4 km",details:["Warm-up: 2 km easy","Main set: 6 × 400m @ ~6:20/km pace","Rest: 90 sec jog between reps","Cool down: 2 km easy","Full WU/CD reached — 2 km each side"]},
      {date:"17 SEP",type:"easy",tag:"EASY",label:"Easy Run",pace:"7:30–8:00/km",km:"45 min",details:["Easy 45 min @ 7:30–8:00/km"]},
      {date:"18 SEP",type:"rest",tag:"REST",label:"Rest",pace:"",km:"",details:["Full rest day"]},
      {date:"19 SEP",type:"long",tag:"LONG",label:"Long Run",pace:"7:15–7:45/km",km:"60 min",details:["Long run 60 min @ 7:15–7:45/km"]},
      {date:"20 SEP",type:"station",tag:"PT",label:"HYROX w/ Jay",pace:"",km:"",details:["HYROX station technique work"]},
    ]
  },
  {
    label: "WEEK 4 · DELOAD", vol: "~11.6 km", deload: true,
    days: [
      {date:"21 SEP",type:"lift",tag:"LIFT",label:"Weight",pace:"",km:"",details:["Own weight training program — normal loads"]},
      {date:"22 SEP",type:"lift",tag:"LIFT",label:"Weight",pace:"",km:"",details:["Own weight training program"]},
      {date:"23 SEP",type:"interval",tag:"INTERVAL",label:"Interval — Light",pace:"~6:20/km",km:"3.2 km",details:["Warm-up: 1 km easy","Main set: 3 × 400m @ ~6:20/km pace","Rest: full standing recovery","Cool down: 1 km easy","Deload week — reduced reps"]},
      {date:"24 SEP",type:"easy",tag:"EASY",label:"Easy Run",pace:"7:30–8:00/km",km:"30 min",details:["Easy 30 min @ 7:30–8:00/km","Deload week — shorter duration"]},
      {date:"25 SEP",type:"rest",tag:"REST",label:"Rest",pace:"",km:"",details:["Full rest day"]},
      {date:"26 SEP",type:"easy",tag:"EASY",label:"Easy Run (no long run)",pace:"7:30–8:00/km",km:"35 min",details:["Easy 35 min — replaces this week's long run","Deload week — no long run"]},
      {date:"27 SEP",type:"station",tag:"PT",label:"HYROX w/ Jay — Light",pace:"",km:"",details:["Technique review only — light loads","No new PRs or max-effort work this week"]},
    ]
  },
];

function render() {
  const dow = document.getElementById("dow-row");
  DOW_LABELS.forEach(d => {
    const el = document.createElement("div");
    el.className = "dow";
    el.textContent = d;
    dow.appendChild(el);
  });

  const container = document.getElementById("weeks-container");

  WEEKS.forEach((week, wIdx) => {
    const wr = document.createElement("div");
    wr.className = "week-row" + (week.deload ? " deload" : "");

    const meta = document.createElement("div");
    meta.className = "week-meta";
    meta.innerHTML = `<span class="wm-label">${week.label}</span><span class="wm-vol${week.deload ? ' deload' : ''}">${week.vol}</span>`;
    wr.appendChild(meta);

    const grid = document.createElement("div");
    grid.className = "day-grid";

    week.days.forEach((s, dIdx) => {
      const cell = document.createElement("div");
      cell.className = `day t-${s.type}`;
      let inner = `<div class="day-num">${s.date}</div>`;
      inner += `<div class="day-tag"><span>${s.tag}</span></div>`;
      inner += `<div class="day-label">${s.label}</div>`;
      if (s.pace) inner += `<div class="day-pace">${s.pace}</div>`;
      if (s.km) inner += `<div class="day-pace">${s.km}</div>`;
      cell.innerHTML = inner;
      cell.onclick = () => handleClick(wIdx, dIdx, cell, wr);
      grid.appendChild(cell);
    });

    wr.appendChild(grid);

    const panel = document.createElement("div");
    panel.className = "detail-panel";
    wr.appendChild(panel);

    container.appendChild(wr);
  });
}

let selected = null;

function handleClick(wIdx, dIdx, cell, weekRow) {
  const panel = weekRow.querySelector(".detail-panel");
  const key = wIdx + "-" + dIdx;

  if (selected === key && panel.classList.contains("open")) {
    panel.classList.remove("open");
    cell.classList.remove("selected");
    selected = null;
    return;
  }

  document.querySelectorAll(".day.selected").forEach(d => d.classList.remove("selected"));
  document.querySelectorAll(".detail-panel.open").forEach(p => p.classList.remove("open"));

  cell.classList.add("selected");
  selected = key;

  const s = WEEKS[wIdx].days[dIdx];
  panel.innerHTML = `
    <div class="dp-head">
      <div>
        <div class="dp-title">${s.label}</div>
        <div class="dp-date">${s.date} · ${s.tag}</div>
      </div>
      <button class="dp-close">✕ CLOSE</button>
    </div>
    <div class="dp-stats">
      ${s.pace ? `<div class="dp-stat"><div class="dp-stat-l">PACE</div><div class="dp-stat-v">${s.pace}</div></div>` : ""}
      ${s.km ? `<div class="dp-stat"><div class="dp-stat-l">VOLUME</div><div class="dp-stat-v">${s.km}</div></div>` : ""}
      <div class="dp-stat"><div class="dp-stat-l">TYPE</div><div class="dp-stat-v">${s.tag}</div></div>
    </div>
    <div class="dp-breakdown">
      <div class="dp-breakdown-label">SESSION BREAKDOWN</div>
      <div class="dp-items">
        ${s.details.map(line => `
          <div class="dp-item">
            <div class="dp-item-dot"></div>
            <div class="dp-item-text">${line}</div>
          </div>
        `).join("")}
      </div>
    </div>
  `;
  panel.querySelector(".dp-close").onclick = () => {
    panel.classList.remove("open");
    cell.classList.remove("selected");
    selected = null;
  };
  panel.classList.add("open");
}

render();
</script>
</body>
</html>
