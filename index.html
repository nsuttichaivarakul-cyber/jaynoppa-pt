<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaynoppa</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #0F0D0A;
    --gold: #D4A24E;
    --gold-bright: #F0C878;
    --cream: #F5F0E6;
    --steel: #8A8474;
  }
  body {
    background: var(--ink);
    color: var(--cream);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  .wrap { max-width: 560px; margin: 0 auto; padding: 0 20px; }

  header { padding: 28px 0 24px; display: flex; justify-content: space-between; align-items: baseline; }
  .wordmark { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1.5px; color: var(--cream); }
  .location { font-size: 12px; color: var(--steel); }

  .plaque {
    background: linear-gradient(135deg, var(--gold-bright) 0%, var(--gold) 100%);
    border-radius: 6px;
    padding: 22px 24px;
    margin-bottom: 32px;
  }
  .plaque-title { font-family: 'Bebas Neue', sans-serif; font-size: 34px; letter-spacing: 1px; color: var(--ink); line-height: 1; }
  .plaque-date { font-size: 13px; color: var(--ink); opacity: 0.75; margin-top: 6px; font-weight: 500; }

  .roster { list-style: none; }
  .row {
    display: block;
    padding: 20px 0;
    border-bottom: 1px solid rgba(212, 162, 78, 0.22);
    text-decoration: none;
    color: var(--cream);
    transition: background 0.15s;
  }
  .row:active { background: rgba(212, 162, 78, 0.08); }
  .row-top { display: flex; align-items: center; gap: 12px; }
  .bib {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: var(--gold-bright);
    border: 1.5px solid var(--gold);
    border-radius: 3px;
    padding: 2px 7px;
    flex-shrink: 0;
  }
  .row-name { font-family: 'Bebas Neue', sans-serif; font-size: 27px; letter-spacing: 0.5px; }
  .row-meta { font-size: 13px; color: var(--steel); margin-top: 4px; }

  footer { padding: 32px 0 40px; font-size: 12px; color: var(--steel); text-align: center; }

  @media (max-width: 420px) {
    .plaque-title { font-size: 28px; }
    .row-name { font-size: 23px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="wordmark">JAYNOPPA</div>
    <div class="location">Bangkok</div>
  </header>

  <div class="plaque">
    <div class="plaque-title">HYROX BANGKOK</div>
    <div class="plaque-date">14 February 2027</div>
  </div>

  <ul class="roster">

    <a class="row" href="/trio/">
      <div class="row-top">
        <span class="bib">N°01</span>
        <span class="row-name">Trio</span>
      </div>
      <div class="row-meta">Open Singles — sub-80 target</div>
    </a>

    <a class="row" href="/benz/">
      <div class="row-top">
        <span class="bib">N°02A</span>
        <span class="row-name">Benz</span>
      </div>
      <div class="row-meta">Doubles — sub-80 target, paired with Toei</div>
    </a>

    <a class="row" href="/toei/">
      <div class="row-top">
        <span class="bib">N°02B</span>
        <span class="row-name">Toei</span>
      </div>
      <div class="row-meta">Doubles — sub-80 target, paired with Benz</div>
    </a>

  </ul>

  <footer>jaynoppa.fit</footer>

</div>

</body>
</html>
